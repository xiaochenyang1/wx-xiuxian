name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, audit, and verify config
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Cocos Creator types
        run: |
          mkdir -p temp/declarations
          cat > temp/declarations/cc.env.d.ts <<'TYPES'
          declare module "cc/env" {
            export const DEBUG: boolean;
            export const DEV: boolean;
            export const WECHAT: boolean;
          }
          TYPES
          cat > temp/tsconfig.cocos.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2015",
              "module": "ES2015",
              "strict": true,
              "types": [
                "@cocos/creator-types/engine",
                "./temp/declarations/cc.env"
              ],
              "experimentalDecorators": true,
              "isolatedModules": true,
              "moduleResolution": "node",
              "noEmit": true,
              "forceConsistentCasingInFileNames": true
            }
          }
          JSON

      - name: Verify release configuration
        run: pnpm verify:release-config

      - name: Verify source boundaries
        run: pnpm verify:source

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --registry=https://registry.npmjs.org --prod --audit-level=high
