services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cultivation_diary
      POSTGRES_USER: cultivation
      POSTGRES_PASSWORD: cultivation_dev
    ports:
      - "5432:5432"
    volumes:
      - cultivation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cultivation -d cultivation_diary"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - cultivation_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cultivation_postgres_data:
  cultivation_redis_data:
